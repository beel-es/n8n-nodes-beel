name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The suite also fails when the generated operations are stale, or when the
      # contract grew an endpoint that is neither generated, hand-written nor
      # explicitly excluded.
      - run: npm test
