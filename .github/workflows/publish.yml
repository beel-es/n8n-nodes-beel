name: Publish

# Publishing is deliberate: it happens when a version tag is pushed, never on a merge.
on:
  push:
    # Both shapes, so a tag written either way releases.
    tags: ['v*.*.*', '*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm record where the package was built from, so anyone installing
      # the node can verify it came from this repository and this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; npm 12 drops Node 20.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # prepublishOnly would run lint, tests and build a second time.
      # Published through npm trusted publishing: the OIDC token above is the only
      # credential, and it also signs the provenance.
      - run: npm publish --provenance --ignore-scripts
