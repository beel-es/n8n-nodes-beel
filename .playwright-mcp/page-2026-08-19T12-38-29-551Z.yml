      - generic [ref=f1e84]:
        - generic [ref=f1e85]: Qué es
        - heading "¿Qué es facturar con Verifactu desde n8n?" [level=2] [ref=f1e87]
        - paragraph [ref=f1e88]: "n8n es una herramienta de automatización: conectas servicios entre sí y defines qué pasa cuando ocurre algo. El nodo de BeeL. añade la pieza que falta en España — emitir una factura legal según el Real Decreto 1007/2023, con numeración correlativa, hash encadenado y código QR, registrada en la AEAT en el momento. Se instala desde el propio n8n como community node y trae 75 operaciones listas: crear y emitir facturas, clientes, productos, series, recurrentes y altas de NIF. La ventaja frente a llamar a la API a mano es que el nodo conoce el contrato: valida los campos antes de que la petición salga de n8n, así que un IVA imposible o un NIF mal formado te lo dice tu propio workflow en vez de un error de la API a mitad de una ejecución. La normativa entra en vigor el 1 de enero de 2027 para sociedades y el 1 de julio de 2027 para autónomos, y puedes montarlo entero en modo test, sin emitir nada real ni consumir cuota, hasta que lo tengas como quieres."
      - generic [ref=f1e90]:
        - generic [ref=f1e91]: Cómo funciona
        - heading "De la venta a la factura legal, sin tocar nada." [level=2] [ref=f1e93]
        - list [ref=f1e94]:
          - listitem [ref=f1e95]:
            - generic [ref=f1e96]: Paso 1
            - heading "Instalas el nodo" [level=3] [ref=f1e101]
            - paragraph [ref=f1e102]: "Desde n8n: Settings → Community Nodes → n8n-nodes-beel. Pegas tu API key y listo."
          - listitem [ref=f1e103]
          - listitem [ref=f1e106]:
            - generic [ref=f1e107]: Paso 2
            - heading "Montas tu flujo" [level=3] [ref=f1e112]
            - paragraph [ref=f1e113]: "Lo que dispare la factura lo decides tú: un formulario, tu CRM, una hoja, un webhook."
          - listitem [ref=f1e114]
          - listitem [ref=f1e117]:
            - generic [ref=f1e118]: Paso 3
            - heading "BeeL. emite y registra" [level=3] [ref=f1e125]
            - paragraph [ref=f1e126]: Factura legal con QR y hash, registrada en la AEAT y enviada al cliente si quieres.
      - generic [ref=f1e128]:
        - generic [ref=f1e129]: Por qué BeeL.
        - heading "Todo lo que necesitas para cumplir, resuelto." [level=2] [ref=f1e131]
        - generic [ref=f1e132]:
          - article [ref=f1e133]:
            - heading "75 operaciones, cero peticiones HTTP" [level=3] [ref=f1e138]
            - paragraph [ref=f1e139]: Facturas, clientes, productos, series, recurrentes, altas de NIF y descarga de PDF, cada una con sus campos en el editor de n8n. No montas URLs, cabeceras ni cuerpos JSON a mano.
          - article [ref=f1e140]:
            - heading "Reejecutar no duplica facturas" [level=3] [ref=f1e144]
            - paragraph [ref=f1e145]: "El nodo lleva clave de idempotencia: si la derivas de tu propio dato — el ID del pedido, por ejemplo — volver a lanzar el workflow devuelve la factura que ya se creó en vez de emitir una segunda. En facturación eso no es comodidad: una factura duplicada con número fiscal solo se arregla con una rectificativa."
          - article [ref=f1e146]:
            - heading "Los errores salen antes de enviar" [level=3] [ref=f1e151]
            - paragraph [ref=f1e152]: "Cada restricción viene del contrato OpenAPI de BeeL.: tipos de IVA válidos según el impuesto, formatos de NIF, campos obligatorios. El workflow falla en el nodo, con el motivo, en lugar de recibir un 422 opaco a media ejecución."
          - article [ref=f1e153]:
            - heading "Se dispara con lo que ya usas" [level=3] [ref=f1e160]
            - paragraph [ref=f1e161]: n8n conecta con cientos de servicios. Factura cuando entre un lead cualificado en tu CRM, cuando alguien firme un presupuesto, cuando se cierre un proyecto — con la lógica que tú decidas, no la que te imponga un conector cerrado.
          - article [ref=f1e162]:
            - heading "Eventos de BeeL. firmados y verificados" [level=3] [ref=f1e174]
            - paragraph [ref=f1e175]: El nodo trigger arranca workflows cuando BeeL. emite una factura, la AEAT responde o una recurrente se pausa. Cada entrega se verifica con su firma HMAC-SHA256 antes de tocar tu flujo, y las repetidas se rechazan.
          - article [ref=f1e176]:
            - heading "Varios NIF desde un mismo workflow" [level=3] [ref=f1e181]
            - paragraph [ref=f1e182]: Si facturas bajo más de un NIF — gestoría, holding, marketplace — eliges la empresa por nodo o por ítem con una expresión. Y si aprovisionas cuentas para clientes, puedes operar sobre las suyas desde el mismo sitio.
