      - generic [ref=f3e84]:
        - generic [ref=f3e85]: Qué es
        - heading "¿Qué es facturar con Verifactu desde n8n?" [level=2] [ref=f3e87]
        - paragraph [ref=f3e88]: "n8n es una herramienta de automatización: conectas servicios entre sí y defines qué pasa cuando ocurre algo. El nodo de BeeL. añade la pieza que falta en España — emitir una factura legal según el Real Decreto 1007/2023, con numeración correlativa, hash encadenado y código QR, registrada en la AEAT en el momento. Se instala desde el propio n8n como community node y trae 75 operaciones listas: crear y emitir facturas, clientes, productos, series, recurrentes y altas de NIF. La ventaja frente a llamar a la API a mano es que el nodo conoce el contrato: valida los campos antes de que la petición salga de n8n, así que un IVA imposible o un NIF mal formado te lo dice tu propio workflow en vez de un error de la API a mitad de una ejecución. La normativa entra en vigor el 1 de enero de 2027 para sociedades y el 1 de julio de 2027 para autónomos, y puedes montarlo entero en modo test, sin emitir nada real ni consumir cuota, hasta que lo tengas como quieres."
      - generic [ref=f3e90]:
        - generic [ref=f3e91]: Cómo funciona
        - heading "Del disparador a la factura legal, sin tocar nada." [level=2] [ref=f3e93]
        - list [ref=f3e94]:
          - listitem [ref=f3e95]:
            - generic [ref=f3e96]: Paso 1
            - heading "Instalas el nodo" [level=3] [ref=f3e101]
            - paragraph [ref=f3e102]: "Desde n8n: Settings → Community Nodes → n8n-nodes-beel. Pegas tu API key y listo."
          - listitem [ref=f3e103]
          - listitem [ref=f3e106]:
            - generic [ref=f3e107]: Paso 2
            - heading "Montas tu flujo" [level=3] [ref=f3e112]
            - paragraph [ref=f3e113]: "Lo que dispare la factura lo decides tú: un formulario, tu CRM, una hoja, un webhook."
          - listitem [ref=f3e114]
          - listitem [ref=f3e117]:
            - generic [ref=f3e118]: Paso 3
            - heading "BeeL. emite y registra" [level=3] [ref=f3e125]
            - paragraph [ref=f3e126]: Factura legal con QR y hash, registrada en la AEAT y enviada al cliente si quieres.
      - generic [ref=f3e128]:
        - generic [ref=f3e129]: Por qué BeeL.
        - heading "Todo lo que necesitas para cumplir, resuelto." [level=2] [ref=f3e131]
        - generic [ref=f3e132]:
          - article [ref=f3e133]:
            - heading "75 operaciones, cero peticiones HTTP" [level=3] [ref=f3e138]
            - paragraph [ref=f3e139]: Facturas, clientes, productos, series, recurrentes, altas de NIF y descarga de PDF, cada una con sus campos en el editor de n8n. No montas URLs, cabeceras ni cuerpos JSON a mano.
          - article [ref=f3e140]:
            - heading "Reejecutar no duplica facturas" [level=3] [ref=f3e144]
            - paragraph [ref=f3e145]: "El nodo lleva clave de idempotencia: si la derivas de tu propio dato — el ID del pedido, por ejemplo — volver a lanzar el workflow devuelve la factura que ya se creó en vez de emitir una segunda. En facturación eso no es comodidad: una factura duplicada con número fiscal solo se arregla con una rectificativa."
          - article [ref=f3e146]:
            - heading "Los errores salen antes de enviar" [level=3] [ref=f3e151]
            - paragraph [ref=f3e152]: "Cada restricción viene del contrato OpenAPI de BeeL.: tipos de IVA válidos según el impuesto, formatos de NIF, campos obligatorios. El workflow falla en el nodo, con el motivo, en lugar de recibir un 422 opaco a media ejecución."
          - article [ref=f3e153]:
            - heading "Se dispara con lo que ya usas" [level=3] [ref=f3e160]
            - paragraph [ref=f3e161]: n8n conecta con cientos de servicios. Factura cuando entre un lead cualificado en tu CRM, cuando alguien firme un presupuesto, cuando se cierre un proyecto — con la lógica que tú decidas, no la que te imponga un conector cerrado.
          - article [ref=f3e162]:
            - heading "Eventos de BeeL. firmados y verificados" [level=3] [ref=f3e174]
            - paragraph [ref=f3e175]: El nodo trigger arranca workflows cuando BeeL. emite una factura, la AEAT responde o una recurrente se pausa. Cada entrega se verifica con su firma HMAC-SHA256 antes de tocar tu flujo, y las repetidas se rechazan.
          - article [ref=f3e176]:
            - heading "Varios NIF desde un mismo workflow" [level=3] [ref=f3e181]
            - paragraph [ref=f3e182]: Si facturas bajo más de un NIF — gestoría, holding, marketplace — eliges la empresa por nodo o por ítem con una expresión. Y si aprovisionas cuentas para clientes, puedes operar sobre las suyas desde el mismo sitio.
