      - generic [ref=f4e84]:
        - generic [ref=f4e85]: Qué es
        - heading "¿Qué es facturar Verifactu en WooCommerce con BeeL.?" [level=2] [ref=f4e87]
        - paragraph [ref=f4e88]: "Facturar Verifactu en WooCommerce es emitir, por cada pedido de tu tienda, una factura legal válida ante Hacienda según el Real Decreto 1007/2023. Si cobras tu WooCommerce a través de Stripe, BeeL. genera la factura automáticamente en cada cobro: la registra en la AEAT, le añade el hash encadenado y el código QR obligatorios, y se la envía al cliente sin que toques nada. No es un plugin que reemplace tu tienda. Es la pieza que conecta el cobro de Stripe con la facturación legal española, algo que WooCommerce no hace por sí solo. La normativa entra en vigor el 1 de enero de 2027 para sociedades y el 1 de julio de 2027 para autónomos, con sanciones de hasta 50.000 euros por usar software que no cumpla. Conectas Stripe en unos minutos, sin escribir código, y puedes probarlo gratis en modo sandbox antes de emitir nada real."
      - generic [ref=f4e90]:
        - generic [ref=f4e91]: Cómo funciona
        - heading "De la venta a la factura legal, sin tocar nada." [level=2] [ref=f4e93]
        - list [ref=f4e94]:
          - listitem [ref=f4e95]:
            - generic [ref=f4e96]: Paso 1
            - heading "Conectas tu Stripe" [level=3] [ref=f4e101]
            - paragraph [ref=f4e102]: En un clic, sin instalar nada en tu tienda ni escribir código.
          - listitem [ref=f4e103]
          - listitem [ref=f4e106]:
            - generic [ref=f4e107]: Paso 2
            - heading "Tu WooCommerce cobra un pedido" [level=3] [ref=f4e112]
            - paragraph [ref=f4e113]: Cada pago de tu tienda pasa por Stripe, como siempre.
          - listitem [ref=f4e114]
          - listitem [ref=f4e117]:
            - generic [ref=f4e118]: Paso 3
            - heading "BeeL. emite la factura" [level=3] [ref=f4e125]
            - paragraph [ref=f4e126]: Legal, con QR y hash, registrada en la AEAT y enviada a tu cliente. Automático.
      - generic [ref=f4e128]:
        - generic [ref=f4e129]: Por qué BeeL.
        - heading "Todo lo que necesitas para cumplir, resuelto." [level=2] [ref=f4e131]
        - generic [ref=f4e132]:
          - article [ref=f4e133]:
            - heading "Una factura legal por cada pedido" [level=3] [ref=f4e138]
            - paragraph [ref=f4e139]: "Cada cobro de tu WooCommerce vía Stripe genera su factura Verifactu: numeración correlativa, hash encadenado y QR de Hacienda. Registrada en la AEAT al momento, sin que hagas nada."
          - article [ref=f4e140]:
            - heading "Conectas y te olvidas" [level=3] [ref=f4e144]
            - paragraph [ref=f4e145]: Enlazas tu cuenta de Stripe en unos minutos, sin escribir código ni instalar plugins en tu tienda. A partir de ahí, BeeL. factura cada venta sola, también noches y fines de semana.
          - article [ref=f4e146]:
            - heading "La factura llega sola a tu cliente" [level=3] [ref=f4e151]
            - paragraph [ref=f4e152]: Tras cada pedido, BeeL. envía la factura al correo del cliente automáticamente. Menos correos de «¿me pasas la factura?» y menos trabajo manual a final de mes.
          - article [ref=f4e153]:
            - heading "También facturas a mano y rectificativas" [level=3] [ref=f4e160]
            - paragraph [ref=f4e161]: "Lo que no entra por la tienda lo emites igual: facturas manuales, abonos y rectificativas, todo con el mismo cumplimiento Verifactu. No necesitas un segundo programa para los casos sueltos."
          - article [ref=f4e162]:
            - heading "Varias tiendas, una sola cuenta" [level=3] [ref=f4e174]
            - paragraph [ref=f4e175]: Si gestionas más de una tienda WooCommerce, conectas varias cuentas de Stripe y cada una factura con su propia serie de numeración. Todo ordenado desde un único sitio.
          - article [ref=f4e176]:
            - heading "Listo para 2027 sin agobios" [level=3] [ref=f4e181]
            - paragraph [ref=f4e182]: Verifactu es obligatorio desde el 1 de enero de 2027 para sociedades y el 1 de julio de 2027 para autónomos. Lo dejas montado hoy, lo pruebas gratis en sandbox y llegas cumpliendo.
