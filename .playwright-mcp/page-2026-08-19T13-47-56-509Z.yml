      - generic [ref=f8e84]:
        - generic [ref=f8e85]: Qué es
        - heading "¿Qué es facturar con n8n y BeeL.?" [level=2] [ref=f8e87]
        - paragraph [ref=f8e88]: "n8n es una herramienta para automatizar tareas sin programar: arrastras bloques, los conectas y decides qué pasa cuando ocurre algo — entra un formulario, se cierra una venta en tu CRM, alguien firma un presupuesto. El nodo de BeeL. añade el bloque que faltaba en España: emitir la factura. Y no un PDF con pinta de factura, sino una factura legal de verdad, con su numeración correlativa, su código QR y su registro en Hacienda en el mismo momento, tal y como exige el Real Decreto 1007/2023. Se instala desde el propio n8n en un par de clics, sin tocar servidores ni instalar nada más, y trae listo todo lo que necesitas: facturas, clientes, productos, series de numeración, facturas recurrentes y alta de nuevos NIF. Si al montarlo te equivocas en algo, el propio workflow te avisa antes de emitir nada — un tipo de IVA que no existe o un NIF mal escrito se detectan ahí mismo, no cuando ya es tarde. La ley obliga desde el 1 de enero de 2027 a las sociedades y desde el 1 de julio de 2027 a los autónomos, y puedes montarlo entero en modo de pruebas, sin emitir facturas reales ni gastar cuota, hasta que haga exactamente lo que quieres."
      - generic [ref=f8e90]:
        - generic [ref=f8e91]: Cómo funciona
        - heading "De lo que ya usas a la factura legal, sin tocar nada." [level=2] [ref=f8e93]
        - list [ref=f8e94]:
          - listitem [ref=f8e95]:
            - generic [ref=f8e96]: Paso 1
            - heading "Instalas el nodo" [level=3] [ref=f8e101]
            - paragraph [ref=f8e102]: "En n8n: Ajustes → Community Nodes → n8n-nodes-beel. Pegas tu clave y ya está."
          - listitem [ref=f8e103]
          - listitem [ref=f8e106]:
            - generic [ref=f8e107]: Paso 2
            - heading "Eliges qué dispara la factura" [level=3] [ref=f8e112]
            - paragraph [ref=f8e113]: Un formulario, tu CRM, una hoja de cálculo, una fecha del calendario. Lo decides tú.
          - listitem [ref=f8e114]
          - listitem [ref=f8e117]:
            - generic [ref=f8e118]: Paso 3
            - heading "BeeL. la emite y la registra" [level=3] [ref=f8e125]
            - paragraph [ref=f8e126]: Factura legal con QR, registrada en Hacienda y enviada a tu cliente si quieres.
      - generic [ref=f8e128]:
        - generic [ref=f8e129]: Por qué BeeL.
        - heading "Todo lo que necesitas para cumplir, resuelto." [level=2] [ref=f8e131]
        - generic [ref=f8e132]:
          - article [ref=f8e133]:
            - heading "Sin escribir código, de verdad" [level=3] [ref=f8e138]
            - paragraph [ref=f8e139]: "Eliges qué quieres hacer en un desplegable y rellenas los huecos, como en cualquier otro nodo de n8n. Tus clientes, tus productos y tus series aparecen en listas: no tienes que copiar códigos raros de ningún sitio."
          - article [ref=f8e140]:
            - heading "Cualquier cosa puede disparar una factura" [level=3] [ref=f8e144]
            - paragraph [ref=f8e145]: n8n se conecta con cientos de herramientas. Factura cuando se cierre un trato en tu CRM, cuando alguien rellene un formulario, cuando termines un proyecto o el día 1 de cada mes. La regla la pones tú, no un conector cerrado.
          - article [ref=f8e146]:
            - heading "Si se ejecuta dos veces, no factura dos veces" [level=3] [ref=f8e151]
            - paragraph [ref=f8e152]: "Los workflows se repiten: se reintentan, los relanzas, algo falla a medias. El nodo lo tiene en cuenta y devuelve la factura que ya existía en lugar de emitir otra. Importa más de lo que parece: una factura duplicada con número legal solo se arregla emitiendo una rectificativa."
          - article [ref=f8e153]:
            - heading "Te avisa antes de emitir, no después" [level=3] [ref=f8e160]
            - paragraph [ref=f8e161]: El nodo sabe qué acepta Hacienda y qué no. Si un tipo de IVA no encaja, si falta un dato obligatorio o si un NIF está mal escrito, tu workflow se para y te lo dice con nombre y apellidos, en vez de emitir algo mal o fallar a medias.
          - article [ref=f8e162]:
            - heading "Te enteras de lo que pasa después" [level=3] [ref=f8e174]
            - paragraph [ref=f8e175]: "Hay un segundo nodo que arranca workflows cuando algo ocurre en BeeL.: una factura emitida, Hacienda que responde, una recurrente que se para. Así puedes avisar por Slack, apuntarlo en una hoja o guardar el PDF donde quieras. Cada aviso se comprueba antes de entrar, para que nadie pueda colártelos."
          - article [ref=f8e176]:
            - heading "Varios negocios, un mismo workflow" [level=3] [ref=f8e181]
            - paragraph [ref=f8e182]: Si facturas con más de un NIF — una gestoría, un grupo de empresas, un marketplace que factura por sus vendedores — eliges de cuál va cada factura sobre la marcha. Y si das de alta clientes nuevos, puedes hacerlo desde el mismo flujo.
